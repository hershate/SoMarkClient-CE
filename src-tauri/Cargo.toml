[package]
name = "somarkclient-ce"
version = "0.1.0"
description = "A resilient visual client for SoMark document intelligence"
edition = "2021"
rust-version = "1.77.2"
license = "Apache-2.0"

[lib]
name = "somarkclient_ce_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
